name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Default for every job: read only. The release job below raises what it needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Unit tests
        run: node --test test/*.test.cjs
      - name: Listener selftest
        run: node agent-listen.cjs --selftest
      - name: Reply selftest
        run: node agent-reply.cjs --selftest
      - name: Ack selftest
        run: node agent-ack.cjs --selftest
      - name: Resolve selftest
        run: node agent-resolve.cjs --selftest
      - name: Secret scan
        run: bash scripts/secret-scan.sh --all

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the archive from the tag
        run: |
          # release.sh takes the version without the leading v
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          bash scripts/release.sh "$VERSION"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/spm-agent-kit-${{ env.VERSION }}.tar.gz
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/spm-agent-kit-$VERSION.tar.gz" dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes "SPM agent kit $VERSION. Built by GitHub Actions from the tag, with a build provenance attestation. Verify the archive with: gh attestation verify spm-agent-kit-$VERSION.tar.gz --repo superproductmanager/spm-agent-kit"
