name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Unit tests
        run: node --test test/*.test.cjs
      - name: Listener selftest
        run: node agent-listen.cjs --selftest
      - name: Reply selftest
        run: node agent-reply.cjs --selftest
      - name: Ack selftest
        run: node agent-ack.cjs --selftest
      - name: Resolve selftest
        run: node agent-resolve.cjs --selftest
      - name: Secret scan
        run: bash scripts/secret-scan.sh --all
